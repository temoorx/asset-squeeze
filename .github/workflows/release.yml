name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: macos-aarch64
            os: macos-14
          - platform: macos-x86_64
            os: macos-13
          - platform: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install jpegtran on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-turbo-progs

      - name: Install jpegtran on macOS
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo

      - name: Install jpegtran on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "3.1.4.1"
          $url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/$version/libjpeg-turbo-$version-vc-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "libjpeg-turbo.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          $candidates = @(
            "C:\libjpeg-turbo64\bin",
            "C:\libjpeg-turbo\bin"
          )

          foreach ($candidate in $candidates) {
            $jpegtran = Join-Path $candidate "jpegtran.exe"
            if (Test-Path $jpegtran) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              Write-Host "Found jpegtran at $jpegtran"
              exit 0
            }
          }

          throw "jpegtran.exe was not found after installing libjpeg-turbo"

      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

      - name: Package release archive
        shell: bash
        run: scripts/package-release.sh "${{ matrix.platform }}" "${{ github.ref_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: asset-squeeze-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
