name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: macos-aarch64
            os: macos-14
          - platform: windows-x86_64
            os: windows-latest

    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install jpegtran on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-turbo-progs patchelf

      - name: Install jpegtran on macOS
        if: runner.os == 'macOS'
        run: brew install jpeg-turbo

      - name: Install WebP tools on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-linux-x86-64.tar.gz -o "$RUNNER_TEMP/libwebp.tar.gz"
          tar -xzf "$RUNNER_TEMP/libwebp.tar.gz" -C "$RUNNER_TEMP"
          find "$RUNNER_TEMP" -type f -name cwebp -printf '%h\n' | head -1 >> "$GITHUB_PATH"

      - name: Install WebP tools on macOS
        if: runner.os == 'macOS'
        run: |
          curl -fsSL https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-mac-arm64.tar.gz -o "$RUNNER_TEMP/libwebp.tar.gz"
          tar -xzf "$RUNNER_TEMP/libwebp.tar.gz" -C "$RUNNER_TEMP"
          dirname "$(find "$RUNNER_TEMP" -type f -name cwebp | head -1)" >> "$GITHUB_PATH"

      - name: Install jpegtran on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "3.1.4.1"
          $url = "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/$version/libjpeg-turbo-$version-vc-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "libjpeg-turbo.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/S" -Wait

          $candidates = @(
            "C:\libjpeg-turbo64\bin",
            "C:\libjpeg-turbo\bin"
          )

          foreach ($candidate in $candidates) {
            $jpegtran = Join-Path $candidate "jpegtran.exe"
            if (Test-Path $jpegtran) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              Write-Host "Found jpegtran at $jpegtran"
              exit 0
            }
          }

          throw "jpegtran.exe was not found after installing libjpeg-turbo"

      - name: Install WebP tools on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0-windows-x64.zip"
          $archive = Join-Path $env:RUNNER_TEMP "libwebp.zip"
          $destination = Join-Path $env:RUNNER_TEMP "libwebp"
          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $destination
          $cwebp = Get-ChildItem -Path $destination -Filter "cwebp.exe" -Recurse | Select-Object -First 1
          if (-not $cwebp) {
            throw "cwebp.exe was not found in the official libwebp archive"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $cwebp.DirectoryName

      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --release

      - name: Package release archive
        shell: bash
        run: scripts/package-release.sh "${{ matrix.platform }}" "${{ github.ref_name }}"

      - name: Smoke test Linux/macOS package
        if: runner.os != 'Windows'
        shell: bash
        run: scripts/smoke-test-unix.sh "${{ matrix.platform }}" dist/asset-squeeze

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows.ps1 -Root dist/asset-squeeze

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: asset-squeeze-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
